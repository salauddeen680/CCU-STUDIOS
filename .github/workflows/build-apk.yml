name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Master Production Android App
        run: |
          mkdir -p /tmp/app-build
          cd /tmp/app-build
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/assets@3.0.5

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ccustudios.app",
            "appName": "CCU Studios",
            "webDir": "public",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://ccu-studios.vercel.app",
              "cleartext": true,
              "allowNavigation": [
                "*.vercel.app",
                "*.razorpay.com",
                "api.razorpay.com",
                "*.google.com",
                "accounts.google.com",
                "*.firebaseapp.com"
              ]
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          mkdir public
          echo "<html><body style='background:#000;color:#fff;'>Loading CCU Studios...</body></html>" > public/index.html

          mkdir -p assets
          curl -sL "https://ccu-studios.vercel.app/ccu-logo.png" -o assets/logo.png
          cp assets/logo.png assets/icon-only.png
          cp assets/logo.png assets/icon-foreground.png
          cp assets/logo.png assets/icon-background.png
          cp assets/logo.png assets/splash.png

          npx cap add android
          npx capacitor-assets generate --android

          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              data = f.read()
          if 'android:usesCleartextTraffic="true"' not in data:
              data = data.replace('<application', '<application android:usesCleartextTraffic="true"')
          queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="upi" />
                  </intent>
                  <package android:name="com.google.android.apps.nbu.paisa.user" />
                  <package android:name="com.phonepe.app" />
                  <package android:name="net.one97.paytm" />
              </queries>
          """
          if '<queries>' not in data:
              data = data.replace('</manifest>', queries + '\n</manifest>')
          with open(manifest_path, "w") as f:
              f.write(data)
          EOF

          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          cat << 'EOF' > android/app/src/main/java/com/ccustudios/app/MainActivity.java
          package com.ccustudios.app;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import android.webkit.CookieManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Message;
          import android.app.Dialog;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView mainWebView = this.bridge.getWebView();
                      WebSettings settings = mainWebView.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setSupportMultipleWindows(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(mainWebView, true);

                      mainWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (url.startsWith("upi:") || url.startsWith("tez:") || url.startsWith("phonepe:") || url.startsWith("paytmmp:")) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(intent);
                                      return true;
                                  } catch (Exception e) {
                                      return false;
                                  }
                              }
                              return false;
                          }
                      });

                      mainWebView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                              WebView popupWebView = new WebView(MainActivity.this);
                              WebSettings pSettings = popupWebView.getSettings();
                              pSettings.setJavaScriptEnabled(true);
                              pSettings.setDomStorageEnabled(true);
                              pSettings.setSupportMultipleWindows(true);

                              CookieManager.getInstance().setAcceptThirdPartyCookies(popupWebView, true);

                              Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                              dialog.setContentView(popupWebView);
                              dialog.show();

                              popupWebView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public boolean shouldOverrideUrlLoading(WebView pView, String url) {
                                      if (url.startsWith("upi:") || url.startsWith("tez:") || url.startsWith("phonepe:") || url.startsWith("paytmmp:")) {
                                          try {
                                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                              startActivity(intent);
                                              return true;
                                          } catch (Exception e) {
                                              return false;
                                          }
                                      }
                                      return false;
                                  }
                              });

                              popupWebView.setWebChromeClient(new WebChromeClient() {
                                  @Override
                                  public void onCloseWindow(WebView window) {
                                      dialog.dismiss();
                                  }
                              });

                              ((WebView.WebViewTransport) resultMsg.obj).setWebView(popupWebView);
                              resultMsg.sendToTarget();
                              return true;
                          }
                      });
                  }
              }
          }
          EOF

          cd android
          chmod +x gradlew
          
          # 🔥 PEHLE BUILD KARENGE TAAKI KEYSTORE BAN JAYE
          ./gradlew assembleDebug --no-daemon
          
          # 🔥 AB SHA-1 KEY NIKALENGE (CRASH PROOF)
          echo "================================================="
          echo "🔑 YAHAN HAI AAPKI SHA-1 KEY FIREBASE KE LIYE:"
          ./gradlew signingReport || true
          echo "================================================="

          ./gradlew bundleDebug --no-daemon

          mkdir -p $GITHUB_WORKSPACE/output
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/CCU-Studios.apk
          cp app/build/outputs/bundle/debug/app-debug.aab $GITHUB_WORKSPACE/output/CCU-Studios.aab

      - name: Upload Direct Install APK
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Direct-Install-APK
          path: output/CCU-Studios.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Store-AAB
          path: output/CCU-Studios.aab
