name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Production Android Wrapper
        run: |
          mkdir /tmp/app-build
          cd /tmp/app-build
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/assets@3.0.5 @capacitor/browser@6.0.0

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ccustudios.app",
            "appName": "CCU Studios",
            "webDir": "public",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://ccu-studios.vercel.app",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

          mkdir public
          echo "<html><body style='background-color:#000;color:#fff;'>Loading CCU Studios...</body></html>" > public/index.html

          mkdir -p assets
          curl -sL "https://ccu-studios.vercel.app/ccu-logo.png" -o assets/logo.png
          cp assets/logo.png assets/icon-only.png
          cp assets/logo.png assets/icon-foreground.png
          cp assets/logo.png assets/icon-background.png
          cp assets/logo.png assets/splash.png

          npx cap add android
          npx capacitor-assets generate --android

          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

          mkdir -p $GITHUB_WORKSPACE/output
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/CCU-Studios.apk
          cp app/build/outputs/bundle/debug/app-debug.aab $GITHUB_WORKSPACE/output/CCU-Studios.aab

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Direct-Install-APK
          path: output/CCU-Studios.apk

      - name: Upload AAB (Store Release Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Store-AAB
          path: output/CCU-Studios.aab
