name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔥 FIX: Stable Capacitor 6 versions pin kiye hain taaki duplicate class clash na ho
      - name: Install Capacitor CLI & Core
        run: |
          npm install -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Initialize Android Native Project
        run: |
          npx cap add android
          npx cap sync android

      # 🔥 FIX: Duplicate classes aur cleartext traffic resolve karne ke flags
      - name: Fix Android Manifest & Gradle Properties
        run: |
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release Bundle (Unsigned AAB)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Direct-Install-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-PlayStore-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
