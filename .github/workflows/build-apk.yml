name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android Native Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Update Permissions for Fullscreen Native App
        run: |
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (For Play Store & Amazon)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Direct-Install-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact (Play Store Release)
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
