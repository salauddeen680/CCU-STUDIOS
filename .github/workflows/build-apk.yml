name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Master Production Android App
        run: |
          mkdir /tmp/app-build
          cd /tmp/app-build
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/assets@3.0.5

          # 1. Capacitor Config with Native Navigation & Razorpay/Google Allow-list
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ccustudios.app",
            "appName": "CCU Studios",
            "webDir": "public",
            "bundledWebRuntime": false,
            "server": {
              "url": "https://ccu-studios.vercel.app",
              "cleartext": true,
              "allowNavigation": [
                "*.vercel.app",
                "*.razorpay.com",
                "api.razorpay.com",
                "*.google.com",
                "accounts.google.com",
                "*.firebaseapp.com"
              ]
            },
            "android": {
              "allowMixedContent": true,
              "appendUserAgent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"
            }
          }
          EOF

          mkdir public
          echo "<html><body style='background:#050505;color:#fff;'>Loading CCU Studios...</body></html>" > public/index.html

          # 2. Official CCU Red Branding Assets
          mkdir -p assets
          curl -sL "https://ccu-studios.vercel.app/ccu-logo.png" -o assets/logo.png
          cp assets/logo.png assets/icon-only.png
          cp assets/logo.png assets/icon-foreground.png
          cp assets/logo.png assets/icon-background.png
          cp assets/logo.png assets/splash.png

          npx cap add android
          npx capacitor-assets generate --android

          # 3. AndroidManifest: Internet + Razorpay / UPI Deep Links whitelist
          python3 - << 'EOF'
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              data = f.read()

          # Add cleartext & hardware acceleration
          data = data.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"')

          # Add queries for UPI Apps & Razorpay Checkout
          queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="upi" />
                  </intent>
                  <package android:name="com.google.android.apps.nbu.paisa.user" />
                  <package android:name="com.phonepe.app" />
                  <package android:name="net.one97.paytm" />
              </queries>
          """
          data = data.replace('</manifest>', queries + '\n</manifest>')

          with open(manifest_path, "w") as f:
              f.write(data)
          EOF

          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

          # 4. Native MainActivity Patch: Full Support for Google OAuth & Razorpay Popups
          cat << 'EOF' > patch.py
          import os

          path = "android/app/src/main/java/com/ccustudios/app/MainActivity.java"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()

              import_stmt = """import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Message;
          import android.app.Dialog;
          import android.os.Bundle;
          """
              if "import android.webkit.WebSettings;" not in content:
                  content = content.replace("package com.ccustudios.app;", "package com.ccustudios.app;\n" + import_stmt)

              method_code = """
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView mainWebView = this.bridge.getWebView();
                      WebSettings settings = mainWebView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setJavaScriptCanOpenWindowsAutomatically(true);
                      settings.setSupportMultipleWindows(true);

                      mainWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (url.startsWith("upi:") || url.startsWith("tez:") || url.startsWith("phonepe:") || url.startsWith("paytmmp:")) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(intent);
                                      return true;
                                  } catch (Exception e) {
                                      return false;
                                  }
                              }
                              return false;
                          }
                      });

                      mainWebView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                              WebView popupWebView = new WebView(MainActivity.this);
                              WebSettings pSettings = popupWebView.getSettings();
                              pSettings.setJavaScriptEnabled(true);
                              pSettings.setDomStorageEnabled(true);
                              pSettings.setSupportMultipleWindows(true);
                              pSettings.setUserAgentString(mainWebView.getSettings().getUserAgentString());

                              Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                              dialog.setContentView(popupWebView);
                              dialog.show();

                              popupWebView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public boolean shouldOverrideUrlLoading(WebView pView, String url) {
                                      if (url.startsWith("upi:") || url.startsWith("tez:") || url.startsWith("phonepe:") || url.startsWith("paytmmp:")) {
                                          try {
                                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                              startActivity(intent);
                                              return true;
                                          } catch (Exception e) {
                                              return false;
                                          }
                                      }
                                      return false;
                                  }
                              });

                              popupWebView.setWebChromeClient(new WebChromeClient() {
                                  @Override
                                  public void onCloseWindow(WebView window) {
                                      dialog.dismiss();
                                  }
                              });

                              ((WebView.WebViewTransport) resultMsg.obj).setWebView(popupWebView);
                              resultMsg.sendToTarget();
                              return true;
                          }
                      });
                  }
              }
              """

              if "@Override\n    public void onCreate" not in content:
                  pos = content.rfind("}")
                  if pos != -1:
                      content = content[:pos] + method_code + "\n}"

              with open(path, "w") as f:
                  f.write(content)
          EOF
          python3 patch.py

          # 5. Build Final Release Artifacts
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

          mkdir -p $GITHUB_WORKSPACE/output
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/output/CCU-Studios.apk
          cp app/build/outputs/bundle/debug/app-debug.aab $GITHUB_WORKSPACE/output/CCU-Studios.aab

      - name: Upload APK (Direct Mobile Install)
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Direct-Install-APK
          path: output/CCU-Studios.apk

      - name: Upload AAB (Play Store Release)
        uses: actions/upload-artifact@v4
        with:
          name: CCU-Studios-Store-AAB
          path: output/CCU-Studios.aab
